# Default

# source = ~/.config/omarchy/current/theme/hyprlock.conf
# general { ... }
# background { ... }
# animations { ... }
# auth { ... }

# My own

$font_family = Geist Mono

input-field {
  monitor =
  size = 440, 60
  position = 0, -440
  halign = center
  valign = center

  inner_color = $inner_color
  outer_color = $outer_color
  outline_thickness = 2

  font_color = $font_color
  font_family = $font_family

  dots_size = 0.2
  dots_spacing = 0.4

  placeholder_text = <span> Enter password 󰈷 </span>
  check_color = $check_color
  fail_text = $FAIL <b>($ATTEMPTS)</b>

  rounding = 0
  shadow_passes = 0
  fade_on_empty = false
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%k:%M")"
  color = $font_color
  font_size = 96
  font_family = $font_family
  position = 0, 320
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = $font_color
  font_size = 18
  font_family = $font_family
  position = 0, 220
  halign = center
  valign = center
}
